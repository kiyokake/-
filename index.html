<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>レヴュースタァライト 設定判別</title>

    <link rel="stylesheet" href="style.css">

<body>

    <div class="container">

        <h1>少女☆歌劇<br>レヴュースタァライト</h1>
        <h2>設定判別ツール</h2>


        <!-- ゲーム数 -->
        <section>

            <h3>ゲーム数</h3>

            <div class="counter">

                <button onclick="changeCount('games', -100)">−</button>

                <input
                    id="games"
                    type="number"
                    min="0"
                    value="0"
                    onchange="setCount('games', this.value)"
                >

                <button onclick="changeCount('games', 100)">＋</button>

            </div>

            <p>G</p>

        </section>

                    id="redBig"
                    type="number"

                <button onclick="changeCount('reg', 1)">＋</button>

            </div>

        </section>

        <!-- 現在の確率 -->
